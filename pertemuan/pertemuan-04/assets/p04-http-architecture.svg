<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eed"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- bg -->
  <rect width="1000" height="680" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">P04 — HTTP &amp; Web Service</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b" letter-spacing="0.4">Client ↔ Server  •  Request Line • Headers • Body JSON • Status Code • REST</text>

  <!-- Client -->
  <rect x="70" y="90" width="260" height="120" rx="16" fill="#dbeafe" stroke="#4a9eed" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">CLIENT</text>
  <text x="200" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Browser / App</text>
  <text x="200" y="158" text-anchor="middle" font-size="12" fill="#334155">User Interface</text>
  <text x="200" y="182" text-anchor="middle" font-size="11" fill="#64748b">Fetch API • curl • Axios</text>

  <!-- Server -->
  <rect x="620" y="90" width="300" height="120" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">SERVER</text>
  <text x="770" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">API / Web Service</text>
  <text x="770" y="158" text-anchor="middle" font-size="12" fill="#334155">Business Logic</text>
  <text x="770" y="182" text-anchor="middle" font-size="11" fill="#64748b">Bun.serve()  •  port 3000</text>

  <!-- DB -->
  <ellipse cx="770" cy="270" rx="110" ry="28" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8"/>
  <rect x="660" y="270" width="220" height="56" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8"/>
  <ellipse cx="770" cy="326" rx="110" ry="28" fill="#99f6e4" stroke="#14b8a6" stroke-width="1.8"/>
  <text x="770" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">Database</text>
  <text x="770" y="318" text-anchor="middle" font-size="11" fill="#475569">users • posts</text>

  <!-- arrows -->
  <line x1="330" y1="132" x2="620" y2="132" stroke="#4a9eed" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="475" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#4a9eed">HTTP Request</text>
  <text x="475" y="148" text-anchor="middle" font-size="10" fill="#334155">POST /api/users  •  JSON</text>

  <line x1="620" y1="172" x2="330" y2="172" stroke="#22c55e" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="475" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">HTTP Response</text>
  <text x="475" y="206" text-anchor="middle" font-size="10" fill="#334155">201 Created  •  JSON + Location</text>

  <line x1="770" y1="210" x2="770" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="790" y1="326" x2="790" y2="212" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr-gray)" opacity="0.9"/>

  <!-- bottom cards -->
  <!-- Request -->
  <rect x="30" y="370" width="310" height="150" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <rect x="30" y="370" width="310" height="36" rx="14" fill="#4a9eed"/>
  <rect x="30" y="390" width="310" height="16" fill="#4a9eed"/>
  <text x="185" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="white">HTTP REQUEST</text>
  <text x="50" y="432" font-size="11" fill="#1e293b"><tspan font-weight="600">Request Line:</tspan> POST /api/users HTTP/1.1</text>
  <text x="50" y="452" font-size="11" fill="#1e293b"><tspan font-weight="600">Headers:</tspan> Content-Type: application/json</text>
  <text x="50" y="468" font-size="11" fill="#64748b">Authorization: Bearer *** • Accept: application/json</text>
  <text x="50" y="490" font-size="11" fill="#1e293b"><tspan font-weight="600">Body:</tspan> { "nama": "Budi", "email": "budi@..." }</text>

  <!-- Response -->
  <rect x="360" y="370" width="310" height="150" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <rect x="360" y="370" width="310" height="36" rx="14" fill="#22c55e"/>
  <rect x="360" y="390" width="310" height="16" fill="#22c55e"/>
  <text x="515" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="white">HTTP RESPONSE</text>
  <text x="380" y="432" font-size="11" fill="#1e293b"><tspan font-weight="600">Status:</tspan> 201 Created</text>
  <text x="380" y="452" font-size="11" fill="#1e293b"><tspan font-weight="600">Headers:</tspan> Content-Type: application/json</text>
  <text x="380" y="468" font-size="11" fill="#64748b">Location: /api/users/1 • X-Request-Id: abc-123</text>
  <text x="380" y="490" font-size="11" fill="#1e293b"><tspan font-weight="600">Body:</tspan> { "id": 1, "nama": "Budi" }</text>

  <!-- Methods -->
  <rect x="690" y="370" width="280" height="150" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
  <rect x="690" y="370" width="280" height="36" rx="14" fill="#f59e0b"/>
  <rect x="690" y="390" width="280" height="16" fill="#f59e0b"/>
  <text x="830" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="white">HTTP METHODS</text>
  <text x="710" y="430" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#16a34a">GET</tspan>    — retrieve  <tspan fill="#64748b">✓ safe • idempotent</tspan></text>
  <text x="710" y="448" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#2563eb">POST</tspan>  — create     <tspan fill="#64748b">✗</tspan></text>
  <text x="710" y="466" font-size="11" fill="#1e293b"><tspan font-weight="700">PUT</tspan>    — replace  <tspan fill="#64748b">✓ idempotent</tspan>  <tspan font-weight="700">PATCH</tspan> — modify</text>
  <text x="710" y="484" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#dc2626">DELETE</tspan> — remove <tspan fill="#64748b">✓ idempotent</tspan></text>
  <text x="710" y="504" font-size="10" fill="#92400e">→ POST tidak idempotent, PUT/DELETE ya</text>

  <!-- status + REST -->
  <rect x="30" y="540" width="940" height="88" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="50" y="564" font-size="11" font-weight="700" fill="#9a3412">STATUS CODES  &amp;  REST PRINCIPLES</text>
  <text x="50" y="584" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#16a34a">2xx Success</tspan>  200 OK • 201 Created • 204 No Content</text>
  <text x="50" y="602" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#dc2626">4xx Client Error</tspan>  400 Bad Request • 401 Unauthorized • 403 Forbidden • 404 Not Found • 405 Method Not Allowed</text>
  <text x="50" y="620" font-size="11" fill="#1e293b"><tspan font-weight="700" fill="#ea580c">5xx Server Error</tspan>  500 Internal Error • 502 Bad Gateway • 503 Unavailable   <tspan fill="#64748b">|</tspan>  <tspan font-weight="600">REST:</tspan> Stateless • Cacheable • Uniform Interface • Layered</text>

  <!-- footer -->
  <text x="500" y="652" text-anchor="middle" font-size="10.5" fill="#64748b">Endpoint:  GET /api/users  •  GET /api/users/:id  •  POST /api/users  •  PUT / PATCH / DELETE /api/users/:id  —  Bun native:  Bun.serve({`{`} port: 3000 {`}`} )  —  test via curl / Fetch API</text>
  <text x="500" y="668" text-anchor="middle" font-size="9" fill="#94a3b8">Excalidraw MCP • https://excalidraw-mcp-orcin-tau.vercel.app/mcp  —  export: https://excalidraw.com/#json=2rGAz1qpHJ-tm_WnGEdG7,0zqh2_46VmgI1nLdUQWxBA</text>
</svg>
