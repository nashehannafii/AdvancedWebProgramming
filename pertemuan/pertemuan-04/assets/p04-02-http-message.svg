<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- request -->
  <rect x="30" y="20" width="410" height="240" rx="14" fill="white" stroke="#bfdbfe" stroke-width="1.6"/>
  <rect x="30" y="20" width="410" height="36" rx="14" fill="#4a9eed"/><rect x="30" y="40" width="410" height="16" fill="#4a9eed"/>
  <text x="235" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="white">HTTP REQUEST</text>
  <text x="50" y="76" font-size="11" font-weight="700" fill="#1e40af">Request Line</text>
  <rect x="50" y="84" width="370" height="26" rx="8" fill="#eff6ff" stroke="#dbeafe"/><text x="60" y="101" font-size="11" font-family="monospace" fill="#1e293b">POST /api/users  HTTP/1.1</text>
  <text x="50" y="132" font-size="11" font-weight="700" fill="#1e40af">Headers</text>
  <text x="50" y="150" font-size="11" fill="#334155">Host: example.com</text>
  <text x="50" y="166" font-size="11" fill="#334155">Content-Type: application/json</text>
  <text x="50" y="182" font-size="11" fill="#94a3b8">Authorization: Bearer ***</text>
  <text x="50" y="204" font-size="11" font-weight="700" fill="#1e40af">Body  <tspan fill="#64748b" font-weight="400">(JSON, bisa kosong untuk GET)</tspan></text>
  <rect x="50" y="212" width="370" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/><text x="60" y="229" font-size="11" font-family="monospace" fill="#334155">{ "nama": "Budi", "email": "budi@..." }</text>
  <!-- response -->
  <rect x="460" y="20" width="410" height="240" rx="14" fill="white" stroke="#bbf7d0" stroke-width="1.6"/>
  <rect x="460" y="20" width="410" height="36" rx="14" fill="#22c55e"/><rect x="460" y="40" width="410" height="16" fill="#22c55e"/>
  <text x="665" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="white">HTTP RESPONSE</text>
  <text x="480" y="76" font-size="11" font-weight="700" fill="#14532d">Status Line</text>
  <rect x="480" y="84" width="370" height="26" rx="8" fill="#f0fdf4" stroke="#dcfce7"/><text x="490" y="101" font-size="11" font-family="monospace" fill="#1e293b">HTTP/1.1  201 Created</text>
  <text x="480" y="132" font-size="11" font-weight="700" fill="#14532d">Headers</text>
  <text x="480" y="150" font-size="11" fill="#334155">Content-Type: application/json</text>
  <text x="480" y="166" font-size="11" fill="#334155">Location: /api/users/1</text>
  <text x="480" y="182" font-size="11" fill="#94a3b8">X-Request-Id: abc-123</text>
  <text x="480" y="204" font-size="11" font-weight="700" fill="#14532d">Body  <tspan fill="#64748b" font-weight="400">(JSON / kosong untuk 204)</tspan></text>
  <rect x="480" y="212" width="370" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/><text x="490" y="229" font-size="11" font-family="monospace" fill="#334155">{ "id": 1, "nama": "Budi" }</text>
</svg>