<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="170" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.6">HTTP METHODS — beda tujuan, beda sifat</text>
  <!-- GET -->
  <rect x="20" y="44" width="160" height="108" rx="12" fill="white" stroke="#bbf7d0" stroke-width="1.6"/>
  <text x="100" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#16a34a">GET</text>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#334155">retrieve</text>
  <rect x="30" y="96" width="140" height="22" rx="11" fill="#dcfce7"/><text x="100" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">✓ Safe  •  ✓ Idempotent</text>
  <text x="100" y="134" text-anchor="middle" font-size="10" fill="#64748b">tidak ubah data</text>
  <!-- POST -->
  <rect x="190" y="44" width="160" height="108" rx="12" fill="white" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="270" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#2563eb">POST</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#334155">create</text>
  <rect x="200" y="96" width="140" height="22" rx="11" fill="#dbeafe"/><text x="270" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">✗ Safe  •  ✗ Idempotent</text>
  <text x="270" y="134" text-anchor="middle" font-size="10" fill="#64748b">buat resource baru</text>
  <!-- PUT -->
  <rect x="360" y="44" width="160" height="108" rx="12" fill="white" stroke="#ddd6fe" stroke-width="1.6"/>
  <text x="440" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#7c3aed">PUT</text>
  <text x="440" y="88" text-anchor="middle" font-size="11" fill="#334155">replace</text>
  <rect x="370" y="96" width="140" height="22" rx="11" fill="#ede9fe"/><text x="440" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">✗ Safe  •  ✓ Idempotent</text>
  <text x="440" y="134" text-anchor="middle" font-size="10" fill="#64748b">ganti seluruh data</text>
  <!-- PATCH -->
  <rect x="530" y="44" width="160" height="108" rx="12" fill="white" stroke="#fde68a" stroke-width="1.6"/>
  <text x="610" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#d97706">PATCH</text>
  <text x="610" y="88" text-anchor="middle" font-size="11" fill="#334155">modify</text>
  <rect x="540" y="96" width="140" height="22" rx="11" fill="#fef3c7"/><text x="610" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">✗ Safe  •  ✗ Idempotent*</text>
  <text x="610" y="134" text-anchor="middle" font-size="10" fill="#64748b">ubah sebagian</text>
  <!-- DELETE -->
  <rect x="700" y="44" width="180" height="108" rx="12" fill="white" stroke="#fecaca" stroke-width="1.6"/>
  <text x="790" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#dc2626">DELETE</text>
  <text x="790" y="88" text-anchor="middle" font-size="11" fill="#334155">remove</text>
  <rect x="715" y="96" width="150" height="22" rx="11" fill="#fee2e2"/><text x="790" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">✗ Safe  •  ✓ Idempotent</text>
  <text x="790" y="134" text-anchor="middle" font-size="10" fill="#64748b">hapus resource</text>
</svg>