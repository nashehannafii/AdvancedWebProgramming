<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="260" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <defs>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.10"/></filter>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a9eed"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>
  <!-- client -->
  <rect x="60" y="50" width="220" height="110" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.8" filter="url(#sh1)"/>
  <circle cx="82" cy="68" r="5" fill="#4a9eed" opacity="0.9"/><circle cx="98" cy="68" r="5" fill="#f59e0b" opacity="0.9"/><circle cx="114" cy="68" r="5" fill="#22c55e" opacity="0.9"/>
  <text x="170" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a5f">Client</text>
  <text x="170" y="122" text-anchor="middle" font-size="12" fill="#334155">Browser / App</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#64748b">UI • Fetch • curl</text>
  <!-- server -->
  <rect x="620" y="50" width="220" height="110" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1.8" filter="url(#sh1)"/>
  <rect x="642" y="68" width="28" height="4" rx="2" fill="#22c55e" opacity="0.8"/><rect x="676" y="68" width="28" height="4" rx="2" fill="#22c55e" opacity="0.5"/><rect x="710" y="68" width="18" height="4" rx="2" fill="#22c55e" opacity="0.3"/>
  <text x="730" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Server</text>
  <text x="730" y="122" text-anchor="middle" font-size="12" fill="#334155">API / Web Service</text>
  <text x="730" y="140" text-anchor="middle" font-size="11" fill="#64748b">Bun.serve() • port 3000</text>
  <!-- DB -->
  <ellipse cx="730" cy="200" rx="80" ry="18" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.6"/>
  <rect x="650" y="200" width="160" height="32" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.6"/>
  <ellipse cx="730" cy="232" rx="80" ry="18" fill="#99f6e4" stroke="#5eead4" stroke-width="1.6"/>
  <text x="730" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">Database</text>
  <!-- arrows -->
  <line x1="280" y1="88" x2="620" y2="88" stroke="#4a9eed" stroke-width="2.6" marker-end="url(#ab)"/>
  <text x="450" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">HTTP Request →</text>
  <line x1="620" y1="128" x2="280" y2="128" stroke="#22c55e" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="450" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">← HTTP Response</text>
  <line x1="730" y1="160" x2="730" y2="182" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ak)"/>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">stateless • setiap request mandiri</text>
</svg>