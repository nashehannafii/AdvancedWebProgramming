<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="20" y="28" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.6">REST — 5 PRINSIP UTAMA</text>
  <rect x="20" y="38" width="164" height="56" rx="10" fill="white" stroke="#e2e8f0"/><text x="102" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Client — Server</text><text x="102" y="74" text-anchor="middle" font-size="10" fill="#64748b">pemisahan concern</text>
  <rect x="194" y="38" width="164" height="56" rx="10" fill="white" stroke="#e2e8f0"/><text x="276" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Stateless</text><text x="276" y="74" text-anchor="middle" font-size="10" fill="#64748b">tiap request mandiri</text>
  <rect x="368" y="38" width="164" height="56" rx="10" fill="white" stroke="#e2e8f0"/><text x="450" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Cacheable</text><text x="450" y="74" text-anchor="middle" font-size="10" fill="#64748b">response bisa di-cache</text>
  <rect x="542" y="38" width="164" height="56" rx="10" fill="white" stroke="#e2e8f0"/><text x="624" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Layered System</text><text x="624" y="74" text-anchor="middle" font-size="10" fill="#64748b">client tak perlu tahu proxy</text>
  <rect x="716" y="38" width="164" height="56" rx="10" fill="white" stroke="#e2e8f0"/><text x="798" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Uniform Interface</text><text x="798" y="74" text-anchor="middle" font-size="10" fill="#64748b">komunikasi terstandar</text>

  <text x="20" y="120" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.6">ENDPOINT DESIGN — konsisten &amp; pakai kata benda jamak</text>
  <rect x="20" y="130" width="860" height="130" rx="12" fill="white" stroke="#e2e8f0"/>
  <!-- header -->
  <rect x="20" y="130" width="860" height="28" rx="12" fill="#0f172a"/><rect x="20" y="146" width="860" height="12" fill="#0f172a"/>
  <text x="50" y="148" font-size="10" font-weight="700" fill="white" letter-spacing="0.5">METHOD</text>
  <text x="160" y="148" font-size="10" font-weight="700" fill="white" letter-spacing="0.5">PATH</text>
  <text x="480" y="148" font-size="10" font-weight="700" fill="white" letter-spacing="0.5">TUJUAN</text>
  <text x="700" y="148" font-size="10" font-weight="700" fill="white" letter-spacing="0.5">CONTOH STATUS</text>
  <!-- rows -->
  <text x="50" y="176" font-size="11" font-weight="800" fill="#16a34a">GET</text><text x="160" y="176" font-size="11" font-family="monospace" fill="#0f172a">/api/users</text><text x="480" y="176" font-size="11" fill="#334155">list semua users</text><text x="700" y="176" font-size="11" fill="#64748b">200 OK</text>
  <text x="50" y="196" font-size="11" font-weight="800" fill="#16a34a">GET</text><text x="160" y="196" font-size="11" font-family="monospace" fill="#0f172a">/api/users/:id</text><text x="480" y="196" font-size="11" fill="#334155">detail satu user</text><text x="700" y="196" font-size="11" fill="#64748b">200 / 404</text>
  <text x="50" y="216" font-size="11" font-weight="800" fill="#2563eb">POST</text><text x="160" y="216" font-size="11" font-family="monospace" fill="#0f172a">/api/users</text><text x="480" y="216" font-size="11" fill="#334155">buat user baru</text><text x="700" y="216" font-size="11" fill="#64748b">201 Created</text>
  <text x="50" y="236" font-size="11" font-weight="800" fill="#7c3aed">PUT</text><text x="96" y="236" font-size="10" fill="#64748b">/ PATCH</text><text x="160" y="236" font-size="11" font-family="monospace" fill="#0f172a">/api/users/:id</text><text x="480" y="236" font-size="11" fill="#334155">ganti / ubah sebagian</text><text x="700" y="236" font-size="11" fill="#64748b">200 / 204</text>
  <text x="50" y="252" font-size="11" font-weight="800" fill="#dc2626">DELETE</text><text x="160" y="252" font-size="11" font-family="monospace" fill="#0f172a">/api/users/:id</text><text x="480" y="252" font-size="11" fill="#334155">hapus user</text><text x="700" y="252" font-size="11" fill="#64748b">204 No Content</text>
</svg>